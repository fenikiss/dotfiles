[colors]
background = #0e0e0e
foreground = #d0d0d0
primary = #d0d0d0
secondary = #d0d0d0
alert = #A54242
disabled = #707880

[bar/example]
; bottom = true
width = 100%
height = 25pt
radius = 0

; dpi = 96
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 4pt
border-size = 0
border-color = #00000000

padding-left = 0
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font;1

modules-left = xworkspaces player-mpris
modules-center = date
modules-right = xkeyboard battery pulseaudio tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/powermenu]
type = custom/text

label = ⏻
label-padding = 1
label-foreground = ${colors.foreground}

click-left = rofi -show power-menu -modi power-menu:./rofi-power-menu

[module/xkeyboard]
type = internal/xkeyboard

blacklist-0 = num lock
blacklist-1 = scroll lock
blacklist-2 = caps lock

layout-icon-0 = us;US
layout-icon-1 = br;BR

format = <label-layout>

click-left = dbus-send --type=method_call --dest=org.gnome.Shell /org/gnome/Shell org.gnome.Shell.Eval string:"imports.ui.status.keyboard.getInputSourceManager().nextSource();" 2>/dev/null || xdotool key GroupForward || setxkbmap -layout us,br -option 'grp:alt_shift_toggle'

[module/player-mpris]
type = custom/script
exec = ~/.config/polybar/scripts/spotify.sh
interval = 1

format = <label>
label-maxlen = 40
label-ellipsis = true

; esconde o módulo quando não há saída
format-prefix = ""

[module/tray]
type = internal/tray
tray-size = 70%
tray-spacing = 3

[module/sep]
type = custom/text
label = "|"
label-foreground = ${colors.disabled}
label-background = ${colors.background}

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

label-volume = %percentage%%
label-muted = 󰝟 0%
label-muted-foreground = ${colors.disabled}

click-right = exec pavucontrol-qt

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰕿
ramp-volume-2 = 󰖀
ramp-volume-3 = 󰖀
ramp-volume-4 = 󰕾
ramp-volume-5 = 󰕾

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#009999}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = 󰖩 %essid%
label-disconnected = 󰖪 Offline

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %A, %d %B - %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

[module/battery]
type = internal/battery

full-at = 98
battery = BAT0
adapter = ACAD
poll-interval = 2
time-format = %H:%M

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = 󰁹 <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝

animation-charging-framerate = 750
